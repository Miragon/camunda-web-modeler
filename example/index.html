<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty inline icon: avoids a 404 /favicon.ico that would dirty the console
         for the future Playwright E2E suite. -->
    <link rel="icon" href="data:," />
    <title>camunda-web-modeler playground</title>
    <style>
      /*
       * bpmn-js / dmn-js render into a host that must have an explicit height,
       * or the canvas collapses to 0px and shows nothing. Fill the viewport.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
