version: 2
updates:
  # Fetch and update latest `npm` packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "develop"
    labels:
      - "Technical Debt"
    schedule:
      interval: weekly
      time: "05:00"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; lift this once it does.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Development and tests stay on the oldest supported React major (see
      # peerDependencies); the react-19 CI job covers the newest one.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        patterns:
          - "*"
  # Fetch and update latest `github-actions` packages
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "05:00"
    target-branch: "develop"
    labels:
      - "Technical Debt"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      github-actions-all:
        patterns:
          - "*"
