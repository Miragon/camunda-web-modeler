name: Publish

on:
  workflow_dispatch:
        
permissions:
  contents: write

concurrency:
  group: bpmn-modeler-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - name: Check pinned dependencies
        uses: Miragon/pin-npm-dependencies@v1
        
      - name: Enable corepack
        run: corepack enable
        
      - name: Setup NodeJS 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --immutable
        
      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        
      - name: Build application
        run: yarn build
        
      - name: Setup .yarnrc.yml
        run: yarn config set npmAuthToken $NPM_AUTH_TOKEN
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_SECRET }}
          
      - name: Publish package
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_SECRET }}
