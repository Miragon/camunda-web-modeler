name: Build

on:
  push:
    branches-ignore: [ develop ]
  pull_request:
    branches: [ develop ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check lockfile is deduplicated
        run: yarn dedupe --check
      - run: yarn lint
      - run: yarn format:check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Miragon/pin-npm-dependencies@v1
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - run: yarn npm audit --all --severity high
        
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn
      - run: yarn test
      - run: yarn build
        
  react-19:
    # devDependencies stay on React 18 so the library keeps compiling against the
    # oldest supported types; this job checks the upper end of the peer range.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn
      - run: yarn up react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn tsc --noEmit -p example/tsconfig.json
      - run: yarn test
      - run: yarn build

  ci:
    if: always()
    needs: [lint, audit, build, react-19]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e '
            to_entries | all(
              .value.result == "success" or .value.result == "skipped"
            )
          '
